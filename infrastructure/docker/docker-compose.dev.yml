services:
  postgres:
    image: postgres:16-alpine
    container_name: tennis_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tennis_platform_db
      POSTGRES_USER: tennis_admin
      POSTGRES_PASSWORD: tennis_password_dev
    ports:
      - "5432:5432"
    volumes:
      - tennis_pgdata:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql

volumes:
  tennis_pgdata:
